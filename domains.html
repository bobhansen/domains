<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Domain</title>
    <style>
        :root {
            --ink: #14110e;
            --panel: #1c1916;
            --raised: #25211d;
            --line: #3d362f;
            --paper: #f3ece3;
            --muted: #a89a8c;
            --copper: #c9924a;
            --copper-bright: #e0b06a;
            --sage: #9dcfb0;
            --sage-dim: #24332c;
            --danger: #e07a6a;
            --focus: rgba(201, 146, 74, 0.35);
            --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
            --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
            --mono: "Cascadia Code", "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            color: var(--paper);
            font-family: var(--sans);
            line-height: 1.45;
            background: var(--ink);
            color-scheme: dark;
        }

        .atmosphere {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 45% at 8% -8%, rgba(201, 146, 74, 0.16), transparent 55%),
                radial-gradient(ellipse 50% 40% at 100% 110%, rgba(90, 130, 110, 0.14), transparent 50%),
                var(--ink);
        }

        .atmosphere::after {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.35;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.7  0 0 0 0 0.62  0 0 0 0 0.5  0 0 0 0.18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        }

        .app {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);
            gap: 1.75rem;
            max-width: 1240px;
            margin: 0 auto;
            padding: 1.5rem clamp(1rem, 3vw, 2rem) 2rem;
        }

        .rail {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            position: sticky;
            top: 1.25rem;
            max-height: calc(100vh - 2.5rem);
        }

        .brand h1 {
            margin: 0.15rem 0 0.4rem;
            font-family: var(--serif);
            font-size: clamp(1.8rem, 2.4vw, 2.35rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.05;
            color: var(--paper);
        }

        .eyebrow {
            margin: 0;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--copper);
        }

        .lede {
            margin: 0;
            color: var(--muted);
            font-size: 0.88rem;
            max-width: 34ch;
        }

        .panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 40%), var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        }

        .controls {
            padding: 1.05rem 1.1rem 1.15rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        fieldset {
            border: 0;
            margin: 0;
            padding: 0;
        }

        legend, label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .tld-chip {
            appearance: none;
            border: 1px solid var(--line);
            background: var(--raised);
            color: var(--paper);
            border-radius: 999px;
            padding: 0.28rem 0.65rem;
            font: 600 0.8rem/1.2 var(--mono);
            cursor: pointer;
        }

        .tld-chip:hover { border-color: var(--copper); color: var(--copper-bright); }

        .tld-chip.is-active {
            background: var(--copper);
            border-color: var(--copper);
            color: #1a130c;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.7rem;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 0.55rem 0.7rem;
            background: var(--ink);
            border: 1px solid var(--line);
            color: var(--paper);
            border-radius: 8px;
            font: 500 0.95rem/1.2 var(--mono);
        }

        input:focus, .tld-chip:focus-visible, button:focus-visible {
            outline: none;
            border-color: var(--copper);
            box-shadow: 0 0 0 3px var(--focus);
        }

        .hint {
            margin: 0.35rem 0 0;
            font-size: 0.75rem;
            color: var(--muted);
        }

        #custom-tld-container { display: none; }
        #custom-tld-container.is-open { display: block; }

        #start-btn {
            width: 100%;
            margin-top: 0.2rem;
            padding: 0.8rem 1rem;
            background: var(--paper);
            color: var(--ink);
            border: 0;
            border-radius: 10px;
            font: 600 0.95rem/1 var(--sans);
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        #start-btn:hover:not(:disabled) {
            background: #fff;
            transform: translateY(-1px);
        }

        #start-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        .log-panel {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0.85rem 0.95rem 1rem;
        }

        .log-panel h2 {
            margin: 0 0 0.55rem;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .log-window {
            flex: 1;
            min-height: 7.5rem;
            max-height: 28vh;
            overflow-y: auto;
            padding: 0.7rem 0.75rem;
            background: #0c0a08;
            border: 1px solid var(--line);
            border-radius: 10px;
            font: 0.75rem/1.45 var(--mono);
            color: var(--muted);
        }

        .log-entry { margin: 0 0 0.2rem; }
        .log-success { color: var(--sage); }
        .log-error { color: var(--danger); }

        .stage {
            min-width: 0;
            padding: 1.25rem 1.35rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .stage-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--line);
        }

        .stage-head h2 {
            margin: 0;
            font-family: var(--serif);
            font-size: 1.55rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .stage-sub {
            margin: 0.25rem 0 0;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .stats {
            display: flex;
            gap: 1.25rem;
            margin: 0;
        }

        .stats div { text-align: right; }

        .stats dt {
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stats dd {
            margin: 0.1rem 0 0;
            font-family: var(--mono);
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--paper);
        }

        #found-count { color: var(--sage); }

        body.is-busy .stage-sub::before {
            content: "";
            display: inline-block;
            width: 0.5rem;
            height: 0.5rem;
            margin-right: 0.45rem;
            border-radius: 50%;
            background: var(--copper);
            box-shadow: 0 0 0 0 rgba(201, 146, 74, 0.6);
            animation: pulse 1.6s ease-out infinite;
            vertical-align: middle;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
            gap: 0.75rem;
        }

        .empty {
            margin: 2.5rem auto;
            max-width: 28ch;
            text-align: center;
            font-family: var(--serif);
            font-style: italic;
            font-size: 1.15rem;
            color: var(--muted);
        }

        .empty[hidden], .results-grid:empty + .empty { display: block; }
        .empty[hidden] { display: none !important; }

        .domain-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.15rem;
            padding: 0.9rem 1.7rem 0.8rem 0.95rem;
            background: var(--raised);
            border: 1px solid var(--line);
            border-radius: 12px;
            text-decoration: none;
            color: var(--paper);
            animation: fadeIn 0.35s ease both;
            transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease, opacity 0.2s ease;
        }

        .domain-card:hover {
            transform: translateY(-2px);
        }

        .domain-card.is-pending:hover { border-color: var(--copper); }
        .domain-card.is-available:hover { border-color: var(--sage); background: var(--sage-dim); }
        .domain-card.is-taken {
            opacity: 0.62;
        }
        .domain-card.is-taken:hover { border-color: var(--danger); }

        .domain-card .stem {
            font-family: var(--serif);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.1;
            overflow-wrap: anywhere;
        }

        .domain-card .suffix {
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--sage);
        }

        .domain-card.is-taken .suffix { color: var(--danger); }

        .domain-card .hint {
            margin-top: 0.35rem;
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .domain-card:hover .hint,
        .domain-card:focus-visible .hint { opacity: 1; }

        .verdict {
            position: absolute;
            right: 0.45rem;
            bottom: 0.4rem;
            width: 1.05rem;
            height: 1.05rem;
            display: grid;
            place-items: center;
            color: var(--muted);
        }

        .verdict-spin {
            width: 0.78rem;
            height: 0.78rem;
            border: 2px solid var(--line);
            border-top-color: var(--copper-bright);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .verdict-ok,
        .verdict-no {
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1;
        }

        .verdict-ok { color: var(--sage); }
        .verdict-no { color: var(--danger); }

        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(20, 17, 14, 0.25);
            border-radius: 50%;
            border-top-color: var(--ink);
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(201, 146, 74, 0.55); }
            100% { box-shadow: 0 0 0 10px rgba(201, 146, 74, 0); }
        }

        @media (max-width: 860px) {
            .app { grid-template-columns: 1fr; padding-bottom: 3rem; }
            .rail {
                position: static;
                max-height: none;
            }
            .log-window { max-height: 9rem; }
            .stage-head { flex-direction: column; align-items: flex-start; }
            .stats div { text-align: left; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

<div class="atmosphere" aria-hidden="true"></div>

<div class="app">
    <aside class="rail">
        <header class="brand">
            <p class="eyebrow">Name foundry</p>
            <h1>Find My Domain</h1>
            <p class="lede">Find available domains names that are easy to say, remember, and type.</p>
        </header>

        <form class="panel controls" onsubmit="return false">
            <fieldset>
                <legend>TLD</legend>
                <div class="chip-row" id="tld-chips">
                    <button type="button" class="tld-chip" data-tld="com">.com</button>
                    <button type="button" class="tld-chip is-active" data-tld="org">.org</button>
                    <button type="button" class="tld-chip" data-tld="net">.net</button>
                    <button type="button" class="tld-chip" data-tld="me">.me</button>
                    <button type="button" class="tld-chip" data-tld="io">.io</button>
                    <button type="button" class="tld-chip" data-tld="co">.co</button>
                    <button type="button" class="tld-chip" data-tld="ai">.ai</button>
                    <button type="button" class="tld-chip" data-tld="app">.app</button>
                    <button type="button" class="tld-chip" data-tld="custom">Custom</button>
                </div>
                <select id="tld-select" class="sr-only" aria-label="TLD">
                    <option value="com">.com</option>
                    <option value="org" selected>.org</option>
                    <option value="net">.net</option>
                    <option value="me">.me</option>
                    <option value="io">.io</option>
                    <option value="co">.co</option>
                    <option value="ai">.ai</option>
                    <option value="app">.app</option>
                    <option value="custom">Custom...</option>
                </select>
                <div id="custom-tld-container">
                    <label for="tld-custom">Custom TLD</label>
                    <input type="text" id="tld-custom" placeholder="tech" autocomplete="off" spellcheck="false">
                </div>
            </fieldset>

            <div>
                <label for="batch-size">Target available</label>
                <input type="number" id="batch-size" value="20" min="1" max="100">
            </div>

            <div class="pair">
                <div>
                    <label for="min-len">Min length</label>
                    <input type="number" id="min-len" value="4" min="2" max="20">
                </div>
                <div>
                    <label for="max-len">Max length</label>
                    <input type="number" id="max-len" value="8" min="2" max="20">
                </div>
            </div>

            <div>
                <label for="short-bias">Short bias</label>
                <input type="number" id="short-bias" value="10" step="0.1" min="0.1">
                <p class="hint">Higher values prefer shorter invented words.</p>
            </div>

            <button id="start-btn" type="button">Start generating</button>
        </form>

        <section class="panel log-panel">
            <h2>Activity</h2>
            <div class="log-window" id="log-window" aria-live="polite">
                <div class="log-entry">Initializing system...</div>
            </div>
        </section>
    </aside>

    <main class="panel stage">
        <header class="stage-head">
            <div>
                <h2>Available names</h2>
                <p class="stage-sub" id="status-line">Loading word model…</p>
            </div>
            <dl class="stats">
                <div>
                    <dt>Found</dt>
                    <dd id="found-count">0</dd>
                </div>
                <div>
                    <dt>Checked</dt>
                    <dd id="checked-count">0</dd>
                </div>
                <div>
                    <dt>Hit rate</dt>
                    <dd id="hit-rate">—</dd>
                </div>
            </dl>
        </header>

        <div class="results-grid" id="results-grid"></div>
        <p class="empty" id="empty-state">Working on finding domain names for you...</p>
    </main>
</div>

<script>
    // --- 1. IndexedDB Wrapper for caching ---
    const DB_NAME = 'DomainGenDB';
    const STORE_NAME = 'cacheStore';

    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (e) => {
                req.result.createObjectStore(STORE_NAME);
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function getCache(key) {
        const db = await openDB();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
        });
    }

    async function setCache(key, value) {
        const db = await openDB();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(value, key);
            tx.oncomplete = () => resolve();
        });
    }

    // --- 2. Logging UI ---
    const logWindow = document.getElementById('log-window');
    function log(msg, type = 'normal') {
        const div = document.createElement('div');
        div.className = `log-entry ${type === 'success' ? 'log-success' : type === 'error' ? 'log-error' : ''}`;
        div.innerText = msg;
        logWindow.appendChild(div);
        logWindow.scrollTop = logWindow.scrollHeight;
    }

    // --- 3. Async Task Pool ---
    async function asyncPool(poolLimit, array, iteratorFn) {
        const ret = [];
        const executing = [];
        for (const item of array) {
            const p = Promise.resolve().then(() => iteratorFn(item));
            ret.push(p);
            if (poolLimit <= array.length) {
                const e = p.then(() => executing.splice(executing.indexOf(e), 1));
                executing.push(e);
                if (executing.length >= poolLimit) {
                    await Promise.race(executing);
                }
            }
        }
        return Promise.all(ret);
    }

    // --- 4. Hit rates and binomial batch sizing ---
    // HIT_RATES[tld][length] = P(listed as available). Filled by measure_hit_rates.py.
    const HIT_RATES = {};

    function lookupHitRate(tld, length) {
        const row = HIT_RATES[tld];
        if (row && row[length] != null) return row[length];
        if (row) {
            const keys = Object.keys(row).map(Number).sort((a, b) => a - b);
            if (!keys.length) return null;
            if (length <= keys[0]) return row[keys[0]];
            if (length >= keys[keys.length - 1]) return row[keys[keys.length - 1]];
            for (let i = 0; i < keys.length - 1; i++) {
                if (length >= keys[i] && length <= keys[i + 1]) {
                    const t = (length - keys[i]) / (keys[i + 1] - keys[i]);
                    return row[keys[i]] * (1 - t) + row[keys[i + 1]] * t;
                }
            }
        }
        let sum = 0, n = 0;
        for (const other of Object.values(HIT_RATES)) {
            if (other[length] != null) {
                sum += other[length];
                n++;
            }
        }
        return n ? sum / n : null;
    }

    function expectedHitRate(tld, minLen, maxLen, shortBias) {
        const acc = [];
        for (let i = 0; i < 500; i++) {
            const w = generator.generate(minLen, maxLen, shortBias);
            if (!w) continue;
            const p = lookupHitRate(tld, w.length);
            if (p != null) acc.push(p);
        }
        if (acc.length) {
            return clampRate(acc.reduce((a, b) => a + b, 0) / acc.length);
        }
        let sum = 0, n = 0;
        for (let len = minLen; len <= maxLen; len++) {
            const p = lookupHitRate(tld, len);
            if (p != null) {
                sum += p;
                n++;
            }
        }
        return n ? clampRate(sum / n) : 0.08;
    }

    function clampRate(p) {
        return Math.min(0.95, Math.max(0.005, p));
    }

    function erf(x) {
        const sign = Math.sign(x);
        x = Math.abs(x);
        const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741;
        const a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
        const t = 1 / (1 + p * x);
        return sign * (1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x));
    }

    function binomCdfLt(n, k, p) {
        if (k <= 0) return 0;
        if (p <= 0) return 1;
        if (p >= 1) return n < k ? 1 : 0;
        const q = 1 - p;
        let term = Math.pow(q, n);
        if (term === 0) {
            const mean = n * p;
            const sd = Math.sqrt(Math.max(n * p * q, 1e-12));
            const z = (k - 0.5 - mean) / sd;
            return 0.5 * (1 + erf(z / Math.SQRT2));
        }
        let cdf = 0;
        for (let i = 0; i < k; i++) {
            cdf += term;
            term = term * (n - i) / (i + 1) * p / q;
        }
        return cdf;
    }

    function calculateRequiredBatchSize(k, p, confidence = 0.95) {
        if (k <= 0) return 0;
        p = clampRate(p);
        let n = Math.max(k, Math.ceil(k / p));
        const maxN = 1200;
        while (n < maxN && binomCdfLt(n, k, p) > 1 - confidence) n++;
        return n;
    }

    // --- 5. Valid IANA TLDs ---
    let validTLDs = new Set();
    async function initTLDs() {
        const cacheKey = 'iana_tlds_v1';
        let cached = await getCache(cacheKey);
        if (cached) {
            validTLDs = new Set(cached);
            return;
        }
        log("Fetching canonical IANA TLD list...");
        try {
            const res = await fetch('https://data.iana.org/TLD/tlds-alpha-by-domain.txt');
            const text = await res.text();
            const tlds = text.split('\n')
                .filter(l => l && !l.startsWith('#'))
                .map(l => l.trim().toLowerCase());
            validTLDs = new Set(tlds);
            await setCache(cacheKey, tlds);
            log(`Loaded ${tlds.length} top-level domains.`, 'success');
        } catch (e) {
            log("Failed to fetch IANA TLDs, relying on basic validation.", "error");
        }
    }

    // --- 6. Markov Generator Engine ---
    class MarkovGenerator {
        constructor(nGram = 3) {
            this.nGram = nGram;
            this.transitions = {};
            this.starts = [];
            this.knownWords = new Set();
        }

        async init() {
            const cacheKey = `markov_model_n${this.nGram}_v1`;
            let cached = await getCache(cacheKey);
            if (cached) {
                this.transitions = cached.transitions;
                this.starts = cached.starts;
                this.knownWords = new Set(cached.knownWords);
                log("Markov model loaded from local browser cache.", "success");
                return;
            }

            log("Downloading 10k English word list for training...");
            let words = [];
            try {
                const res = await fetch('https://raw.githubusercontent.com/first20hours/google-10000-english/master/google-10000-english-no-swears.txt');
                const text = await res.text();
                words = text.split('\n').map(w => w.trim().toLowerCase()).filter(w => w && /^[a-z]+$/.test(w));
            } catch(e) {
                log("Fetch failed. Using hardcoded fallback words.", "error");
                words = ["action", "animal", "beauty", "camera", "danger", "energy", "family", "garden", "health", "jungle", "living", "memory", "nature", "orange", "picture", "reason", "secret", "travel", "window"];
            }

            log(`Training generator on ${words.length} words...`);
            this.knownWords = new Set(words);

            for (let word of words) {
                if (word.length <= this.nGram) continue;
                this.starts.push(word.slice(0, this.nGram));
                for (let i = 0; i < word.length - this.nGram; i++) {
                    let state = word.slice(i, i + this.nGram);
                    let nextChar = word[i + this.nGram];
                    if (!this.transitions[state]) this.transitions[state] = [];
                    this.transitions[state].push(nextChar);
                }
                let endState = word.slice(-this.nGram);
                if (!this.transitions[endState]) this.transitions[endState] = [];
                this.transitions[endState].push(null);
            }

            await setCache(cacheKey, {
                transitions: this.transitions,
                starts: this.starts,
                knownWords: Array.from(this.knownWords)
            });
            log("Training complete and cached.", "success");
        }

        generate(minLen, maxLen, shortBias) {
            for (let attempt = 0; attempt < 100; attempt++) {
                let word = this.starts[Math.floor(Math.random() * this.starts.length)];

                while (word.length < 50) {
                    let state = word.slice(-this.nGram);
                    let choices = this.transitions[state];

                    if (!choices || choices.length === 0) break;

                    let nextChar;
                    if (shortBias !== 1.0 && choices.includes(null)) {
                        let counts = new Map();
                        for (let c of choices) counts.set(c, (counts.get(c) || 0) + 1);

                        let population = Array.from(counts.keys());
                        let weights = population.map(c => c === null ? counts.get(c) * shortBias : counts.get(c));
                        let totalWeight = weights.reduce((a, b) => a + b, 0);

                        let r = Math.random() * totalWeight;
                        for (let i = 0; i < population.length; i++) {
                            r -= weights[i];
                            if (r <= 0) {
                                nextChar = population[i];
                                break;
                            }
                        }
                    } else {
                        nextChar = choices[Math.floor(Math.random() * choices.length)];
                    }

                    if (nextChar === null) break;
                    word += nextChar;
                }

                if (word.length >= minLen && word.length <= maxLen && !this.knownWords.has(word)) {
                    return word;
                }
            }
            return null;
        }
    }

    // --- 7. Availability: DNS low-pass, then RDAP confirm ---
    // DNS NXDOMAIN means "not delegated", not "unregistered". Chits appear as
    // soon as DNS passes; RDAP (when the TLD has it) fills in the corner mark.
    // RFC 7480 §5.5: RDAP 429 → decrease rate and honor Retry-After (RFC 6585).
    const DNS_RCODE_NXDOMAIN = 3;
    const DNS_TYPE_SOA = 6;
    const DNS_TYPE_NS = 2;
    const DNS_CONCURRENCY = 16;
    const RDAP_CONCURRENCY = 2;
    const RATE_WAIT_CAP_MS = 90_000;
    const VERDICT = {
        pending: { cls: 'is-pending', title: 'Checking another source...' },
        available: { cls: 'is-available', title: "Looks like it's available" },
        taken: { cls: 'is-taken', title: "We thought it was available, but it wasn't." },
    };
    let rdapBases = new Map();

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function parseRetryAfterMs(res) {
        const raw = res.headers.get('Retry-After');
        if (raw) {
            const trimmed = raw.trim();
            if (/^\d+(\.\d+)?$/.test(trimmed)) {
                return Math.min(RATE_WAIT_CAP_MS, Number(trimmed) * 1000);
            }
            const when = Date.parse(trimmed);
            if (!Number.isNaN(when)) {
                return Math.min(RATE_WAIT_CAP_MS, Math.max(0, when - Date.now()));
            }
        }
        const reset = res.headers.get('RateLimit-Reset') || res.headers.get('X-RateLimit-Reset');
        if (reset && /^\d+(\.\d+)?$/.test(reset.trim())) {
            const n = Number(reset);
            const ms = n > 1e10 ? n - Date.now() : n > 1e9 ? n * 1000 - Date.now() : n * 1000;
            if (ms > 0) return Math.min(RATE_WAIT_CAP_MS, ms);
        }
        return null;
    }

    function createServiceGate(initialConcurrency) {
        let cap = initialConcurrency;
        let active = 0;
        const q = [];
        let coolUntil = 0;
        let gapMs = 0;
        let lastStart = 0;
        let timer = null;

        function arm(ms) {
            if (timer) return;
            timer = setTimeout(() => {
                timer = null;
                pump();
            }, Math.max(0, ms));
        }

        function pump() {
            const now = Date.now();
            if (now < coolUntil) {
                arm(coolUntil - now);
                return;
            }
            const gap = lastStart + gapMs - now;
            if (gap > 0) {
                arm(gap);
                return;
            }
            while (active < cap && q.length && Date.now() >= coolUntil && Date.now() >= lastStart + gapMs) {
                const job = q.shift();
                active++;
                lastStart = Date.now();
                Promise.resolve()
                    .then(job.fn)
                    .then(job.resolve, job.reject)
                    .finally(() => {
                        active--;
                        pump();
                    });
            }
        }

        return {
            schedule(fn) {
                return new Promise((resolve, reject) => {
                    q.push({ fn, resolve, reject });
                    pump();
                });
            },
            pause(ms) {
                coolUntil = Math.max(coolUntil, Date.now() + ms);
                gapMs = Math.max(gapMs, Math.min(Math.floor(ms / 3), 2500));
                if (cap > 1) cap = Math.max(1, Math.ceil(cap / 2));
                pump();
            }
        };
    }

    const hostGates = new Map();

    function gateFor(url, concurrency) {
        const host = new URL(url).hostname;
        if (!hostGates.has(host)) hostGates.set(host, createServiceGate(concurrency));
        return hostGates.get(host);
    }

    async function fetchHonoringRateLimit(url, options, concurrency) {
        const gate = gateFor(url, concurrency);
        const host = new URL(url).hostname;
        let res;
        for (let attempt = 0; attempt < 8; attempt++) {
            try {
                res = await gate.schedule(() => fetch(url, options));
            } catch (e) {
                // A 429/WAF page without Access-Control-Allow-Origin is hidden from
                // JS: Firefox logs CORS, Chrome says "blocked by CORS policy", fetch
                // rejects. Back off the host the same way as an explicit 429.
                const wait = Math.min(12_000, 800 * 2 ** attempt);
                log(`Request to ${host} blocked (often HTTP 429 without CORS headers); waiting ${(wait / 1000).toFixed(1)}s.`);
                gate.pause(wait);
                await sleep(wait);
                continue;
            }
            if (res.status !== 429 && res.status !== 503) return res;
            const hinted = parseRetryAfterMs(res);
            const wait = hinted != null ? Math.max(hinted, 250) : Math.min(10_000, 500 * 2 ** attempt);
            log(`HTTP ${res.status} from ${host}; waiting ${(wait / 1000).toFixed(1)}s` +
                (hinted != null ? ' (Retry-After).' : ' (backoff).'));
            gate.pause(wait);
            await sleep(wait);
        }
        throw new Error(`rate limited: HTTP ${res && res.status} for ${url}`);
    }

    async function initRdapBootstrap() {
        const cacheKey = 'iana_rdap_dns_v2';
        let cached = await getCache(cacheKey);
        if (cached && cached.tlds && cached.bases) {
            rdapBases = new Map(Object.entries(cached.bases));
            return;
        }
        log("Fetching IANA RDAP bootstrap...");
        try {
            const res = await fetch('https://data.iana.org/rdap/dns.json');
            const data = await res.json();
            const tlds = [];
            const bases = {};
            for (const svc of data.services || []) {
                const urls = svc[1] || [];
                const base = String(urls[0] || '').replace(/\/?$/, '/');
                for (const name of svc[0] || []) {
                    const t = String(name).toLowerCase();
                    tlds.push(t);
                    if (base) bases[t] = base;
                }
            }
            rdapBases = new Map(Object.entries(bases));
            await setCache(cacheKey, { tlds, bases });
            log(`Registry RDAP listed for ${tlds.length} TLDs.`, 'success');
        } catch (e) {
            log("Failed to load RDAP bootstrap; falling back to DNS for all TLDs.", "error");
        }
    }

    function tldHasRdap(tld) {
        return !!rdapBaseFor(tld);
    }

    function rdapBaseFor(tld) {
        const labels = tld.toLowerCase().split('.').filter(Boolean);
        for (let i = 0; i < labels.length; i++) {
            const suffix = labels.slice(i).join('.');
            if (rdapBases.has(suffix)) return rdapBases.get(suffix);
        }
        return null;
    }

    function rdapLookupUrl(domain, tld) {
        const base = rdapBaseFor(tld);
        if (base) return `${base}domain/${encodeURIComponent(domain)}`;
        return `https://rdap.org/domain/${encodeURIComponent(domain)}`;
    }

    function isAuthoritativeNegative(data) {
        if (!data || data.Status !== DNS_RCODE_NXDOMAIN) return false;
        const authority = data.Authority || [];
        return authority.some(rr => rr.type === DNS_TYPE_SOA);
    }

    function dnsIsDelegated(data) {
        const answer = (data && data.Answer) || [];
        return answer.some(rr => rr.type === DNS_TYPE_NS || rr.type === 5);
    }

    async function dnsLooksUndelegated(domain) {
        const res = await fetchHonoringRateLimit(
            `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=NS`,
            { headers: { 'Accept': 'application/dns-json' } },
            DNS_CONCURRENCY
        );
        if (!res.ok) return false;
        const data = await res.json();
        if (dnsIsDelegated(data)) return false;
        return isAuthoritativeNegative(data);
    }

    async function rdapIsUnregistered(domain, tld) {
        const res = await fetchHonoringRateLimit(
            rdapLookupUrl(domain, tld),
            { headers: { 'Accept': 'application/rdap+json' } },
            RDAP_CONCURRENCY
        );
        if (res.status === 404) return true;
        if (res.status === 200) return false;
        throw new Error(`RDAP HTTP ${res.status}`);
    }

    async function scanNames(words, tld, { onDnsHit, onRdap }) {
        const useRdap = tldHasRdap(tld);
        const rdapTasks = [];

        await asyncPool(DNS_CONCURRENCY, words, async (word) => {
            const fqdn = `${word}.${tld}`;
            let undelegated = false;
            try {
                undelegated = await dnsLooksUndelegated(fqdn);
            } catch (e) {
                return;
            }
            if (!undelegated) return;
            onDnsHit(word);
            if (!useRdap) return;
            rdapTasks.push((async () => {
                try {
                    onRdap(word, await rdapIsUnregistered(fqdn, tld));
                } catch (e) {
                    log(`RDAP still unresolved for ${fqdn}: ${e.message}`, 'error');
                }
            })());
        });

        await Promise.all(rdapTasks);
    }

    // --- 8. UI Logic and Main Loop ---
    const generator = new MarkovGenerator();
    let isRunning = false;

    const tldSelect = document.getElementById('tld-select');
    const tldChips = document.getElementById('tld-chips');
    const customTldContainer = document.getElementById('custom-tld-container');
    const tldCustom = document.getElementById('tld-custom');
    const btnStart = document.getElementById('start-btn');
    const resultsGrid = document.getElementById('results-grid');
    const foundCountEl = document.getElementById('found-count');
    const checkedCountEl = document.getElementById('checked-count');
    const hitRateEl = document.getElementById('hit-rate');
    const statusLine = document.getElementById('status-line');
    const emptyState = document.getElementById('empty-state');

    function syncTldChips() {
        const value = tldSelect.value;
        tldChips.querySelectorAll('.tld-chip').forEach(btn => {
            btn.classList.toggle('is-active', btn.dataset.tld === value);
        });
        customTldContainer.classList.toggle('is-open', value === 'custom');
    }

    function updateStats(found, checked) {
        foundCountEl.textContent = String(found);
        checkedCountEl.textContent = String(checked);
        hitRateEl.textContent = checked ? `${((found / checked) * 100).toFixed(1)}%` : '—';
        emptyState.hidden = resultsGrid.childElementCount > 0;
    }

    function setVerdictMark(el, status) {
        const spec = VERDICT[status];
        el.textContent = '';
        el.title = spec.title;
        el.setAttribute('aria-label', spec.title);
        if (status === 'pending') {
            const spin = document.createElement('span');
            spin.className = 'verdict-spin';
            el.appendChild(spin);
            return;
        }
        const mark = document.createElement('span');
        mark.className = status === 'available' ? 'verdict-ok' : 'verdict-no';
        mark.textContent = status === 'available' ? '✓' : '✕';
        el.appendChild(mark);
    }

    function upsertChit(word, tld, status) {
        const dom = `${word}.${tld}`;
        let a = resultsGrid.querySelector(`[data-domain="${dom}"]`);
        if (!a) {
            a = document.createElement('a');
            a.className = 'domain-card';
            a.dataset.domain = dom;
            a.href = `https://www.namecheap.com/domains/registration/results/?domain=${encodeURIComponent(dom)}`;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';

            const stemEl = document.createElement('span');
            stemEl.className = 'stem';
            stemEl.textContent = word;

            const suffixEl = document.createElement('span');
            suffixEl.className = 'suffix';
            suffixEl.textContent = '.' + tld;

            const hintEl = document.createElement('span');
            hintEl.className = 'hint';
            hintEl.textContent = 'Namecheap ↗';

            const verdictEl = document.createElement('span');
            verdictEl.className = 'verdict';

            a.append(stemEl, suffixEl, hintEl, verdictEl);
            resultsGrid.appendChild(a);
        }
        a.classList.remove('is-pending', 'is-available', 'is-taken');
        a.classList.add(VERDICT[status].cls);
        setVerdictMark(a.querySelector('.verdict'), status);
        return a;
    }

    tldChips.addEventListener('click', (e) => {
        const btn = e.target.closest('.tld-chip');
        if (!btn) return;
        tldSelect.value = btn.dataset.tld;
        syncTldChips();
        if (btn.dataset.tld === 'custom') tldCustom.focus();
    });

    tldSelect.addEventListener('change', syncTldChips);
    syncTldChips();

    async function bootstrap() {
        btnStart.disabled = true;
        btnStart.innerHTML = '<span class="loader"></span> Loading...';
        statusLine.textContent = 'Loading word model…';
        await initTLDs();
        await initRdapBootstrap();
        await generator.init();
        btnStart.disabled = false;
        btnStart.innerText = 'Start generating';
        statusLine.textContent = 'Ready — searching automatically.';
        runMainLoop();
    }

    async function runMainLoop() {
        if (isRunning) return;

        let tld = tldSelect.value === 'custom' ? tldCustom.value.trim().toLowerCase() : tldSelect.value;
        tld = tld.replace(/^\./, '');

        if (!tld) {
            log("Please enter a custom TLD.", "error");
            return;
        }

        if (validTLDs.size > 0 && !validTLDs.has(tld)) {
            log(`Warning: ".${tld}" does not appear to be a valid IANA TLD.`, "error");
            return;
        }

        const targetCount = parseInt(document.getElementById('batch-size').value, 10) || 20;
        const minLen = parseInt(document.getElementById('min-len').value, 10) || 4;
        const maxLen = parseInt(document.getElementById('max-len').value, 10) || 8;
        const shortBias = parseFloat(document.getElementById('short-bias').value) || 1.0;

        isRunning = true;
        document.body.classList.add('is-busy');
        btnStart.disabled = true;
        btnStart.innerHTML = '<span class="loader"></span> Searching...';
        resultsGrid.innerHTML = '';
        updateStats(0, 0);
        statusLine.textContent = `Searching .${tld} · ${minLen}–${maxLen} letters`;

        const priorRate = expectedHitRate(tld, minLen, maxLen, shortBias);
        const useRdap = tldHasRdap(tld);
        let allAvailable = [];
        let checkedHistory = new Set();
        let currentRate = priorRate;
        let totalChecked = 0;
        let round = 1;

        log(`Starting search for ${targetCount} .${tld} domains...`);
        log(`Expected hit rate ${(priorRate * 100).toFixed(1)}% from length mix ${minLen}–${maxLen}.`);
        if (useRdap) {
            log(`Using registry RDAP to confirm names that DNS says are undelegated.`);
        } else {
            log(`No RDAP for .${tld}; treating authoritative DNS NXDOMAIN as available.`);
        }

        try {
            while (allAvailable.length < targetCount) {
                let remaining = targetCount - allAvailable.length;
                let queriesNeeded = calculateRequiredBatchSize(remaining, currentRate, 0.95);
                if (queriesNeeded < 5) queriesNeeded = 5;

                log(`--- Round ${round} ---`);
                log(`Calculated ${queriesNeeded} queries needed (Rate est: ${(currentRate*100).toFixed(1)}%)`);
                statusLine.textContent = `Searching .${tld} · round ${round}`;

                let candidates = [];
                let attempts = 0;
                while (candidates.length < queriesNeeded && attempts < queriesNeeded * 20) {
                    let w = generator.generate(minLen, maxLen, shortBias);
                    if (w && !checkedHistory.has(w) && !candidates.includes(w)) {
                        candidates.push(w);
                    }
                    attempts++;
                }

                if (candidates.length === 0) {
                    log("Could not generate enough unique candidates matching constraints.", "error");
                    break;
                }

                candidates.forEach(c => checkedHistory.add(c));

                log(useRdap
                    ? `Checking ${candidates.length} names: DNS×${DNS_CONCURRENCY} pipelined into RDAP×${RDAP_CONCURRENCY}...`
                    : `Checking ${candidates.length} names against Cloudflare DoH...`);

                const roundAvailable = [];
                await scanNames(candidates, tld, {
                    onDnsHit(word) {
                        upsertChit(word, tld, useRdap ? 'pending' : 'available');
                        if (!useRdap) {
                            roundAvailable.push(`${word}.${tld}`);
                            allAvailable.push(`${word}.${tld}`);
                        }
                        updateStats(allAvailable.length, totalChecked + candidates.length);
                    },
                    onRdap(word, ok) {
                        upsertChit(word, tld, ok ? 'available' : 'taken');
                        if (ok) {
                            roundAvailable.push(`${word}.${tld}`);
                            allAvailable.push(`${word}.${tld}`);
                        }
                        updateStats(allAvailable.length, totalChecked + candidates.length);
                    }
                });

                totalChecked += candidates.length;
                updateStats(allAvailable.length, totalChecked);

                if (roundAvailable.length > 0) {
                    log(`Found ${roundAvailable.length} this round!`, 'success');
                } else {
                    log("None found this round.");
                }

                if (totalChecked > 0) {
                    currentRate = Math.max(0.01, allAvailable.length / totalChecked);
                }

                round++;
            }

            statusLine.textContent = `Done · ${allAvailable.length} of ${targetCount} · ${totalChecked} checked`;
            log(`Done! Checked ${totalChecked} domains. Found ${allAvailable.length}.`, 'success');

        } catch (e) {
            log(`Error during search: ${e.message}`, 'error');
            statusLine.textContent = 'Search stopped on an error.';
        } finally {
            isRunning = false;
            document.body.classList.remove('is-busy');
            btnStart.disabled = false;
            btnStart.innerText = 'Start generating';
        }
    }

    btnStart.addEventListener('click', runMainLoop);
    window.onload = bootstrap;
</script>
</body>
</html>
